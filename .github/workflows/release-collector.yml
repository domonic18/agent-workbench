name: release-collector

on:
  push:
    tags:
      - "collector-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 tag(如 collector-v0.1.0),用它创建或更新 Release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile

      - name: 校验 tag 版本与 package.json 一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            collector-v*) ;;
            *) echo "tag 必须是 collector-v<版本> 形式,收到 $TAG" >&2; exit 1 ;;
          esac
          pkg_version=$(node -p "require('./collector/package.json').version")
          tag_version="${TAG#collector-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "版本不一致: tag $TAG 对应 $tag_version,collector/package.json 是 $pkg_version" >&2
            exit 1
          fi
          echo "版本一致: $pkg_version"

      - name: Build macOS binaries
        run: pnpm --filter @aw/collector run package

      - name: Checksums
        run: |
          set -eu
          cd collector/dist/bin
          shasum -a 256 aw-node-macos-arm64 aw-node-macos-x64 > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          cd collector/dist/bin
          cp ../../../scripts/install-aw-node.sh .
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber aw-node-macos-arm64 aw-node-macos-x64 checksums.txt install-aw-node.sh
          else
            gh release create "$TAG" \
              --title "aw-node ${TAG#collector-}" \
              --notes "aw-node 预编译产物(macOS arm64 / x64)。安装见 install-aw-node.sh。" \
              aw-node-macos-arm64 aw-node-macos-x64 checksums.txt install-aw-node.sh
          fi
