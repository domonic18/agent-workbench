name: agent-workbench

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agent_workbench
      POSTGRES_USER: agent_workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填(.env)}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_workbench -d agent_workbench"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    # 02 §1:仅内部网络,不映射宿主机端口,不暴露公网

  console:
    build:
      context: ..
      dockerfile: docker/Dockerfile.console
      args:
        AW_UID: ${AW_UID:-10001}
        AW_GID: ${AW_GID:-10001}
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://agent_workbench:${POSTGRES_PASSWORD}@postgres:5432/agent_workbench
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../workspace:/app/workspace
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  frpc:
    image: snowdreamtech/frpc:0.61.1
    profiles: ["tunnel"]
    depends_on:
      console:
        condition: service_healthy
    command: ["-c", "/etc/frp/frpc.toml"]
    env_file:
      - ../.env
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres:
