<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .tile { fill: #2563eb; }
    .letter {
      fill: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    @media (prefers-color-scheme: dark) {
